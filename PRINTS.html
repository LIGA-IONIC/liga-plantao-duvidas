<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print · Plantao Duvidas</title>
<link rel="stylesheet" href="prints.css">
<style>
body{background:#fff;padding:16px 12px 32px}
.exemplo{text-align:center;font-size:0.72rem;letter-spacing:0.16em;font-weight:800;color:#94a3b8;margin:0 0 12px}
.bloco h2{display:none}
.fone{box-shadow:none;border:0;border-radius:12px;min-height:0}
.tb{background:#0891b2}
.btn.main{background:#0891b2}
</style>
</head>
<body>
<p class="exemplo">EXEMPLO VISUAL</p>
<div class="grid">
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Plantao Duvidas</span><span style="font-weight:600;font-size:0.8rem;">sair</span></div>
      <div class="pad">
        <div class="item"><div><strong>Seg 10:00 Auth</strong><div class="muted">vago</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Seg 10:30 Lista</strong><div class="muted">ocupado</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Ter 14:00 Service</strong><div class="muted">vago</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Qua 09:00 Firestore</strong><div class="muted">vago</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Qui 16:00 Extra</strong><div class="muted">ocupado</div></div><span class="badge ok">+</span></div>
        <button class="btn main">Continuar</button>
      </div>
    </div>
  </div>
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Plantao Duvidas</span><span style="font-weight:600;font-size:0.8rem;">voltar</span></div>
      <div class="pad">
        <div class="item">
        <div>
        <strong>Assunto</strong>
        <div class="muted">Firebase Auth</div>
        </div>
        </div>
        <div class="item">
        <div>
        <strong>Horario</strong>
        <div class="muted">nao escolhido</div>
        </div>
        <span class="badge bad">faltando</span>
        </div>
        <div class="aviso erro">Escolha um horario vago para agendar</div>
        <button class="btn ghost">Agendar</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
